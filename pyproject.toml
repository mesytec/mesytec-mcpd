# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
# https://scikit-build-core.readthedocs.io/en/stable/configuration/

[build-system]
requires = ["scikit-build-core>=0.12", "setuptools-scm", "pybind11>=3.0", "pybind11-stubgen", "numpy"]
build-backend = "scikit_build_core.build"

[project]
name = "mesytec_mcpd"
dynamic = ["version"]
requires-python = ">= 3.10"
authors = [ { name = "Florian Lüke", email = "f.lueke@mesytec.com" } ]
description = "Driver library and tools for the mesytec PSD+ system"
readme = "README.md"
license = "BSL-1.0"
license-files = ["LICEN[CS]E*"]
keywords = ["mesytec", "MCPD", "MPSD", "MDLL", "neutron scattering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["numpy", "click"]

[project.optional-dependencies]
gui = ["pyqtgraph", "PySide6", "platformdirs"]
dev = ["pre-commit", "scikit-build-core>=0.12", "setuptools-scm", "pybind11-stubgen", "ruff", "pytest"]

[project.gui-scripts]
mesytec-mcpd-gui = "mesytec_mcpd.gui:main"

[project.scripts]
mcpd-cli-py = "mesytec_mcpd.cli.main:main"

[project.urls]
Homepage = "https://mesytec.com/products/neutron-scattering.html"
Repository = "https://github.com/mesytec/mesytec-mcpd"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.args = [ '-DMCPD_ENABLE_PYTHON=ON', '-DMCPD_BUILD_TESTS=OFF', '-DMCPD_BUILD_MCPD_CLI=OFF' ]
build.verbose = true
logging.level = "INFO"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
wheel.packages = [ "mesytec_mcpd" ]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.cibuildwheel.windows]
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel} --no-dll mesytec-mcpd.dll"

[tool.ruff]
line-length = 100
target-version = "py310"

# https://docs.astral.sh/ruff/rules/, https://docs.astral.sh/ruff/settings/#lint_select
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "Q", "EXE"]

[tool.pyside6-project]
files = ["src/gui/main_window.py", "src/gui/resources.qrc"]
